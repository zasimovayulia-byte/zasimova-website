backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "hero"
    label: "1. Головна сторінка (Hero)"
    file: "content/hero.json"
    fields:
      - { label: "Заголовок (Ім'я)", name: "title", widget: "string", default: "Yuliia ZASIMOVA" }
      - { label: "Підзаголовок (Тип голосу)", name: "subtitle", widget: "string", default: "soprano" }
      - { label: "Головне фото співачки (Фон)", name: "main_image", widget: "image" }

  - name: "biography"
    label: "2. Біографія"
    file: "content/biography.json"
    fields:
      - { label: "Заголовок", name: "title", widget: "string", default: "Biography" }
      - { label: "Текст біографії", name: "body", widget: "markdown" }
      - { label: "Фото для біографії", name: "bio_image", widget: "image" }

  - name: "schedule"
    label: "3. Афіша виступів"
    file: "content/schedule.json"
    fields:
      - label: "Список виступів"
        name: "events"
        widget: "list"
        fields:
          - { label: "День (число)", name: "day", widget: "string" }
          - { label: "Місяць (наприклад, OCT)", name: "month", widget: "string" }
          - { label: "Назва опери / Концерт", name: "opera", widget: "string" }
          - { label: "Партія / Роль", name: "role", widget: "string" }
          - { label: "Театр / Оперний дім", name: "house", widget: "string" }
          - { label: "Місто / Країна", name: "location", widget: "string" }

  - name: "repertoire"
    label: "4. Репертуар"
    file: "content/repertoire.json"
    fields:
      - label: "Список ролей"
        name: "roles"
        widget: "list"
        fields:
          - { label: "Композитор", name: "composer", widget: "string" }
          - { label: "Опера", name: "opera", widget: "string" }
          - { label: "Партія / Роль", name: "role", widget: "string" }

  - name: "media"
    label: "5. Аудіо та Відео"
    file: "content/media.json"
    fields:
      - label: "Аудіозаписи"
        name: "audio_tracks"
        widget: "list"
        fields:
          - { label: "Назва арії / твору", name: "title", widget: "string" }
          - { label: "Опис / Оперна партія", name: "subtitle", widget: "string" }
          - { label: "Аудіофайл (MP3)", name: "audio_file", widget: "file" }
      - label: "Відеозаписи"
        name: "videos"
        widget: "list"
        fields:
          - { label: "Назва виступу", name: "title", widget: "string" }
          - { label: "Посилання на YouTube/Vimeo", name: "video_url", widget: "string" }

  - name: "gallery"
    label: "6. Фотогалерея"
    file: "content/gallery.json"
    fields:
      - label: "Фотографії галереї"
        name: "photos"
        widget: "list"
        fields:
          - { label: "Фотографія", name: "image", widget: "image" }
          - { label: "Підпис / Опис", name: "caption", widget: "string", required: false }

  - name: "press"
    label: "7. Преса та відгуки"
    file: "content/press.json"
    fields:
      - label: "Цитати критики"
        name: "reviews"
        widget: "list"
        fields:
          - { label: "Цитата", name: "quote", widget: "text" }
          - { label: "Видання (наприклад, Opera Magazine)", name: "source", widget: "string" }
          - { label: "Автор рецензії", name: "author", widget: "string", required: false }

  - name: "contacts"
    label: "8. Контакти та Соцмережі"
    file: "content/contacts.json"
    fields:
      - { label: "Email", name: "email", widget: "string" }
      - { label: "Телефон", name: "phone", widget: "string", required: false }
      - { label: "Агентство / Менеджмент", name: "agency", widget: "string", required: false }
      - { label: "Локація / Базування", name: "location", widget: "string", default: "Zurich / Kyiv" }
      - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
      - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
      - { label: "YouTube URL", name: "youtube", widget: "string", required: false }
      - { label: "Spotify URL", name: "spotify", widget: "string", required: false }
      - { label: "OperaBase URL", name: "operabase", widget: "string", required: false }
